# Every push gets checked. Leapfrog L2, 2026-08-09 (rayli); rolled out here 2026-08-14.
#
# NO SECRETS IN THIS FILE, AND NONE MAY BE ADDED TO IT. The build step below reads three
# repository VARIABLES (gh variable set, not gh secret set) — NEXT_PUBLIC_SUPABASE_URL,
# NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_ROUND_LENGTH. None of the three is sensitive: the
# anon key is RLS-protected and ships inside every client bundle regardless (this repo's own
# CLAUDE.md calls it "safe for client-side"), and root CLAUDE.md already records it in cleartext.
# They're variables rather than literals in this file only so gitleaks doesn't flag a JWT-shaped
# string that has no secret behind it. The build needs them because the "/" page constructs a
# Supabase client during static generation and throws without them.

name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    # This name string is what a required status check would match on. Do not rename it.
    name: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the Vercel project's own nodeVersion (24.x), so CI builds on what production
          # builds on.
          node-version: '24'
          cache: npm

      - name: install
        id: install
        run: npm ci

      - name: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          # 2026-09-25: the app is the restored Lovable build (Vite), which reads VITE_* names.
          # The repository variables keep their old NEXT_PUBLIC_* names; only the mapping changed.
          VITE_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
